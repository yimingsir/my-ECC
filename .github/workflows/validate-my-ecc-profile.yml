name: Validate my-ECC profile

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund --loglevel=error

      - name: Validate curated profile
        run: node scripts/apply-my-ecc-profile.mjs --check

      - name: Validate hook schema
        run: node scripts/ci/validate-hooks.js
