name: Sync ECC upstream release

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: sync-upstream-release
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get latest upstream release
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG=$(gh api repos/affaan-m/ECC/releases/latest --jq '.tag_name')
          echo "Latest upstream release: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Keep upstream workflows disabled
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for workflow in ci.yml discussion-announce.yml generator-generic-ossf-slsa3-publish.yml maintenance.yml monthly-metrics.yml release-announce.yml release.yml supply-chain-watch.yml taste-skills.yml; do
            echo "Checking $workflow..."
            state=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}" --jq '.state')

            if [ "$state" = "active" ]; then
              echo "Disabling $workflow..."
              gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/disable" >/dev/null
            else
              echo "$workflow is already disabled (state=$state)."
            fi
          done

      - name: Fetch upstream
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/affaan-m/ECC.git
          git fetch upstream --tags --prune

      - name: Merge upstream release
        env:
          RELEASE_TAG: ${{ steps.upstream.outputs.tag }}
          WORKFLOW_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}
        run: |
          set -euo pipefail
          git checkout main
          UPSTREAM_COMMIT=$(git rev-list -n 1 "$RELEASE_TAG")
          RELEASE_VERSION=$(git show "$RELEASE_TAG:VERSION")
          RELEASE_VERSION="${RELEASE_VERSION//$'\r'/}"
          RELEASE_VERSION="$(printf '%s' "$RELEASE_VERSION" | tr -d '[:space:]')"
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "ERROR: VERSION at $RELEASE_TAG is invalid: '$RELEASE_VERSION'"
            exit 1
          fi

          echo "Upstream release: $RELEASE_TAG"
          echo "Upstream commit: $UPSTREAM_COMMIT"
          echo "Release VERSION: $RELEASE_VERSION"
          echo "Current fork HEAD: $(git rev-parse HEAD)"

          HAS_NEW_RELEASE=true

          if git merge-base --is-ancestor "$UPSTREAM_COMMIT" HEAD; then
            HAS_NEW_RELEASE=false
            echo "Already contains $RELEASE_TAG. Checking curated overlay for drift..."
          else
            echo "New upstream release detected. Merging $RELEASE_TAG..."
            if ! git merge --no-edit "$RELEASE_TAG"; then
              echo "Merge reported conflicts. Inspecting unresolved paths..."
              CONFLICTS=$(git diff --name-only --diff-filter=U)
              BAD_CONFLICT=false
              while IFS= read -r conflict; do
                case "$conflict" in
                  .claude-plugin/plugin.json|.claude-plugin/marketplace.json|ecc/setup.json|.mcp.json) ;;
                  *)
                    if ! node -e 'const fs=require("fs"); const p=JSON.parse(fs.readFileSync("config/my-ecc-profile.json","utf8")); process.exit(p.agents.includes(process.argv[1].replace(/^agents\\//,"").replace(/\\.md$/,"")) ? 0 : 1);' "$conflict"; then
                      BAD_CONFLICT=true
                    fi
                    ;;
                  *) BAD_CONFLICT=true ;;
                esac
              done <<< "$CONFLICTS"
              if [ "$BAD_CONFLICT" = true ] || [ -z "$CONFLICTS" ]; then
                echo "Unexpected merge conflicts:"
                printf '%s\n' "$CONFLICTS"
                exit 1
              fi
              while IFS= read -r conflict; do
                git checkout --theirs "$conflict"
                git add "$conflict"
              done <<< "$CONFLICTS"
              git commit --no-edit
            fi
          fi

          # VERSION is a release-tag baseline, not a value inherited from
          # upstream main or from a previous fork state. This also repairs
          # forks that were originally created from an upstream main branch
          # whose VERSION had already advanced beyond the latest release.
          CURRENT_VERSION=$(tr -d '[:space:]' < VERSION)
          if [ "$CURRENT_VERSION" != "$RELEASE_VERSION" ]; then
            echo "Aligning VERSION: $CURRENT_VERSION -> $RELEASE_VERSION"
            printf '%s\n' "$RELEASE_VERSION" > VERSION
            git add VERSION
            git commit -m "chore: align ECC VERSION with upstream release $RELEASE_TAG"
          else
            echo "VERSION already matches $RELEASE_VERSION."
          fi

          echo "Re-applying my-ECC curated profile..."
          node scripts/apply-my-ecc-profile.mjs

          mapfile -t AGENT_PATHS < <(node -e 'const fs=require("fs"); const p=JSON.parse(fs.readFileSync("config/my-ecc-profile.json","utf8")); console.log(p.agents.map(a => "agents/" + a + ".md").join("\n"));')
          GENERATED_PATHS=(.claude-plugin/plugin.json .claude-plugin/marketplace.json ecc/setup.json .mcp.json "${AGENT_PATHS[@]}")
          if ! git diff --quiet -- "${GENERATED_PATHS[@]}"; then
            git add -- "${GENERATED_PATHS[@]}"
            git commit -m "chore: refresh my-ECC curated profile"
          fi

          echo "Push updated main..."
          git push origin main

          echo "Sync release tag $RELEASE_TAG..."
          REMOTE_TAG_COMMIT=$(git ls-remote origin "refs/tags/$RELEASE_TAG^{}" | awk 'NR==1 {print $1}')
          if [ -z "$REMOTE_TAG_COMMIT" ]; then
            if [ -z "${WORKFLOW_TOKEN:-}" ]; then
              echo "ERROR: WORKFLOW_TOKEN is required to create/update release tags that reference commits containing .github/workflows/*."
              echo "Create a fine-grained PAT with Contents: Read and write + Workflows: Read and write for this repository, then save it as the WORKFLOW_TOKEN Actions secret."
              exit 1
            fi

            # actions/checkout@v4 stores GITHUB_TOKEN under the URL-specific
            # http.https://github.com/.extraheader key. Clear that exact key
            # so the PAT-authenticated URL is the only credential used here.
            TAG_REMOTE="https://x-access-token:${WORKFLOW_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git -c http.https://github.com/.extraheader= push "$TAG_REMOTE" "refs/tags/$RELEASE_TAG"
            echo "Created tag $RELEASE_TAG on fork."
          elif [ "$REMOTE_TAG_COMMIT" = "$UPSTREAM_COMMIT" ]; then
            echo "Tag $RELEASE_TAG already exists on fork and points to the correct commit."
          else
            echo "ERROR: Tag $RELEASE_TAG already exists on fork but points to a different commit."
            exit 1
          fi

          echo "Successfully synced $RELEASE_TAG"
