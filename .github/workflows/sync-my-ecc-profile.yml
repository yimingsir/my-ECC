name: Sync my-ECC profile

on:
  push:
    branches: [main]
    paths:
      - 'config/my-ecc-profile.json'
      - 'scripts/apply-my-ecc-profile.mjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-my-ecc-profile
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply my-ECC profile
        run: node scripts/apply-my-ecc-profile.mjs

      - name: Verify generated profile
        run: node scripts/apply-my-ecc-profile.mjs --check

      - name: Commit generated artifacts
        run: |
          mapfile -t AGENT_PATHS < <(node -e 'const fs=require("fs"); const p=JSON.parse(fs.readFileSync("config/my-ecc-profile.json","utf8")); console.log(p.agents.map(a => "agents/" + a + ".md").join("\n"));')
          GENERATED_PATHS=(.claude-plugin/plugin.json .claude-plugin/marketplace.json ecc/setup.json .mcp.json "${AGENT_PATHS[@]}")

          if git diff --quiet -- "${GENERATED_PATHS[@]}"; then
            echo "Generated profile artifacts are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- "${GENERATED_PATHS[@]}"

          git commit -m "chore: regenerate my-ECC profile artifacts"
          git push
